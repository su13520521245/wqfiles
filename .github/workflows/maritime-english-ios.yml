name: MaritimeEnglish iOS build

on:
  push:
    branches: [claude/maritime-english-ios-app-q0yq4w]
    paths: ["MaritimeEnglish/**", ".github/workflows/maritime-english-ios.yml"]
  workflow_dispatch:

concurrency:
  group: maritime-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actions runner OK"
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcrun swift --version
      - name: Build (simulator) + unsigned archive → .ipa
        working-directory: MaritimeEnglish
        run: ./build_ipa.sh unsigned
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeEnglish-unsigned-ipa-${{ matrix.os }}
          path: MaritimeEnglish/build/MaritimeEnglish-unsigned.ipa
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: MaritimeEnglish/build/*.log
