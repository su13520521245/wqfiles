name: MaritimeEnglish
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MaritimeEnglish:
    type: application
    platform: iOS
    sources:
      - path: MaritimeEnglish
    settings:
      base:
        # TODO: 請改成您自己的 Bundle ID
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.maritimeenglish
        PRODUCT_NAME: MaritimeEnglish
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 三副航海英語
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # TODO: 有 Mac 時填入您的 Team ID
        DEVELOPMENT_TEAM: ""
