workflows:
  maritime-english-unsigned:
    name: MaritimeEnglish unsigned ipa
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'claude/maritime-english-ios-app-q0yq4w'
          include: true
    scripts:
      - name: Build unsigned ipa
        script: |
          cd MaritimeEnglish
          ./build_ipa.sh unsigned
    artifacts:
      - MaritimeEnglish/build/MaritimeEnglish-unsigned.ipa
      - MaritimeEnglish/build/*.log
